<!DOCTYPE html><html lang="tg"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>University Portal V2 Full - 6000</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}body{background:#eef3f8}header{background:linear-gradient(135deg,#0d47a1,#1976d2);color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.main{display:flex}.sidebar{width:250px;background:#fff;padding:10px}.menu{padding:11px;border-radius:10px;cursor:pointer;margin:4px 0;font-size:14px}.menu.active,.menu:hover{background:#e3f2fd;color:#0d47a1;font-weight:700}.content{flex:1;padding:15px}.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 3px 12px rgba(0,0,0,.05);margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.btn{padding:9px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:700}.btn-p{background:#1976d2;color:#fff}.btn-s{background:#2e7d32;color:#fff}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin:6px 0}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;font-size:13px}.badge{padding:3px 8px;border-radius:12px;color:#fff;font-size:11px}.b-sahar{background:#0288d1}.b-abet{background:#ef6c00}.b-roy{background:#2e7d32}.b-shart{background:#c62828}.hidden{display:none}.login{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d47a1,#42a5f5);padding:15px}.login-card{background:#fff;padding:22px;border-radius:18px;width:100%;max-width:400px}.tab{padding:8px 12px;cursor:pointer;border-bottom:3px solid transparent}.tab.active{border-color:#1976d2;color:#1976d2;font-weight:800}</style></head><body>
<div id="loginPage" class="login"><div class="login-card"><h2 style="text-align:center;color:#0d47a1">🎓 Портали V2 ПУРРА</h2><p style="text-align:center;font-size:12px;color:#666">6000 донишҷӯ (3000 саҳар + 3000 абет) | 200 омӯзгор | ID+Код | Сурат | Китобхона</p><div style="text-align:center;margin:10px 0"><span id="tabL" class="tab active" onclick="showTab('L')">Ворид</span><span id="tabR" class="tab" onclick="showTab('R')">Код гузоштан</span></div>
<div id="fL"><input id="lid" placeholder="ID: 1-6000, 7001-7200 омӯзгор, 9999 админ" type="number"><input id="lpass" type="password" placeholder="Коди шахсӣ"><button class="btn btn-p" style="width:100%" onclick="doLogin()">Ворид шудан</button><p style="font-size:11px;color:#666;margin-top:6px">Бори аввал: ID + код 4 рақам гузоред - сабт мешавад!</p></div>
<div id="fR" class="hidden"><input id="rid" placeholder="ID 1-6000" type="number"><input id="rname" placeholder="Номи пурра"><select id="rfac"><option value="iqtisod">Иқтисод (Декан Назиров А. А-101)</option><option value="huquq">Ҳуқуқ (Раҳимов Б. Б-205)</option><option value="tib">Тиб (Салимова М. В-302)</option><option value="muhandisi">Муҳандисӣ (Каримов Д. Г-104)</option><option value="zabonho">Забонҳо (Ҳакимова С. Д-201)</option><option value="it">IT (Алиев Ф. Е-303)</option></select><select id="rtype"><option value="sahar">Саҳархон</option><option value="abet">Абетхон</option></select><input id="rp1" type="password" placeholder="Код"><input id="rp2" type="password" placeholder="Такрори код"><button class="btn btn-s" style="width:100%" onclick="doReg()">Сабти код</button></div><div id="msg" style="margin-top:10px;text-align:center;font-size:12px"></div></div></div>
<div id="appPage" class="hidden"><header><div style="font-weight:900">🎓 UNIVERSITY V2 FULL</div><div style="display:flex;align-items:center;gap:8px"><div style="text-align:right"><div id="hname" style="font-weight:700;font-size:13px"></div><div id="hrole" style="font-size:10px"></div></div><div id="hava" style="width:36px;height:36px;background:#fff;color:#0d47a1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden"></div><button onclick="doLogout()" style="background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 10px;border-radius:6px">Баромад</button></div></header><div class="main"><div class="sidebar" id="sidebar"></div><div class="content" id="content"></div></div></div>
<script>
const faculties={iqtisod:{name:"Иқтисод",dekan:"Проф. Назиров А.",aud:"А-101",deanId:10000},huquq:{name:"Ҳуқуқ",dekan:"Проф. Раҳимов Б.",aud:"Б-205",deanId:10010},tib:{name:"Тиб",dekan:"Проф. Салимова М.",aud:"В-302",deanId:20010},muhandisi:{name:"Муҳандисӣ",dekan:"Проф. Каримов Д.",aud:"Г-104",deanId:30010},zabonho:{name:"Забонҳо",dekan:"Проф. Ҳакимова С.",aud:"Д-201",deanId:40010},it:{name:"IT",dekan:"Проф. Алиев Ф.",aud:"Е-303",deanId:50010}};
const subjectsList={iqtisod:["Микроиқтисод","Макроиқтисод","Муҳосибот","Маркетинг","Омор"],huquq:["Конститутсия","Ҷиноят","Гражданӣ","Байналмилалӣ","Суд"],tib:["Анатомия","Физиология","Биохимия","Фармакология","Ҷарроҳӣ"],muhandisi:["Математикаи олӣ","Физика","Механика","Материал","Лоиҳа"],zabonho:["Англисӣ","Тоҷикӣ","Русӣ","Адабиёт","Тарҷума"],it:["Програмиронӣ","База","Шабака","AI","Веб"]};
let DB=JSON.parse(localStorage.getItem('uni_v2_full')||'null');
if(!DB){DB={users:{},grades:{},attendance:{},payments:{},news:[{title:"Оғози семестр!",text:"Аз 1 сентябр дарсҳо",date:"2026-09-01"},{title:"Китобхона нав",text:"1000 китоби нав",date:"2026-09-20"},{title:"Пардохти шартнома",text:"То 1 октябр",date:"2026-09-25"}],library:[{title:"Иқтисод-Манкю",faculty:"iqtisod",author:"Манкю"},{title:"Ҳуқуқ",faculty:"huquq",author:"Раҳимов"},{title:"Анатомия",faculty:"tib",author:"Сабуров"},{title:"JS Course",faculty:"it",author:"Aliyev"},{title:"Механика",faculty:"muhandisi",author:"Каримов"},{title:"English Grammar",faculty:"zabonho",author:"Hakimova"},{title:"Python",faculty:"it",author:"Гвидо"},{title:"Маркетинг",faculty:"iqtisod",author:"Котлер"}]};for(let i=1;i<=6000;i++){let k=Object.keys(faculties);let f=k[i%6];let type=i<=3000?"sahar":"abet";let isFree=i%3==0;DB.users[i]={id:i,name:"Донишҷӯ "+i,role:"student",faculty:f,type:type,course:(i%4)+1,group:"Г-"+((i%20)+1),payment:isFree?"roy":"shart",paid:isFree||i%2==0,photo:null,password:null,subjects:subjectsList[f]}} for(let i=7001;i<=7200;i++){let k=Object.keys(faculties);let f=k[i%6];DB.users[i]={id:i,name:"Омӯзгор "+(i-7000),role:"teacher",faculty:f,subject:subjectsList[f][i%5],photo:null,password:null,aud:faculties[f].aud}}[10000,10010,20010,30010,40010,50010].forEach(id=>{let f=Object.keys(faculties).find(k=>faculties[k].deanId==id);DB.users[id]={id:id,name:faculties[f].dekan,role:"dean",faculty:f,photo:null,password:null}});DB.users[9999]={id:9999,name:"Админ",role:"admin",faculty:"it",photo:null,password:"9999"};localStorage.setItem('uni_v2_full',JSON.stringify(DB));}
let currentUser=null;function saveDB(){localStorage.setItem('uni_v2_full',JSON.stringify(DB))}function showTab(t){document.getElementById('fL').classList.toggle('hidden',t!='L');document.getElementById('fR').classList.toggle('hidden',t!='R');document.getElementById('tabL').classList.toggle('active',t=='L');document.getElementById('tabR').classList.toggle('active',t=='R')}function doReg(){let id=parseInt(document.getElementById('rid').value),name=document.getElementById('rname').value,fac=document.getElementById('rfac').value,type=document.getElementById('rtype').value,p1=document.getElementById('rp1').value,p2=document.getElementById('rp2').value,msg=document.getElementById('msg');if(!id||!name||!p1){msg.innerHTML="<span style='color:red'>Пур кунед!</span>";return}if(p1!=p2){msg.innerHTML="<span style='color:red'>Парол як хел нест!</span>";return}if(!DB.users[id]){msg.innerHTML="<span style='color:red'>ID нест!</span>";return}if(DB.users[id].password){msg.innerHTML="<span style='color:red'>Аллакай код дорад!</span>";return}DB.users[id].name=name;DB.users[id].faculty=fac;DB.users[id].type=type;DB.users[id].password=p1;saveDB();msg.innerHTML="<span style='color:green'>Код гузошта шуд! Ворид шавед ✅</span>";showTab('L');document.getElementById('lid').value=id}function doLogin(){let id=parseInt(document.getElementById('lid').value),pass=document.getElementById('lpass').value,msg=document.getElementById('msg'),user=DB.users[id];if(!user){msg.innerHTML="<span style='color:red'>ID нодуруст!</span>";return}if(!user.password){if(pass.length>=4){user.password=pass;saveDB();msg.innerHTML="<span style='color:green'>Код гузошта шуд: "+pass+". Боз пахш кунед!</span>";return}else{msg.innerHTML="<span style='color:orange'>Бори аввал! Код гузоред</span>";return}}if(user.password!=pass){msg.innerHTML="<span style='color:red'>Код нодуруст! ID дигар истифода баред (2,3,4)</span>";return}currentUser=user;localStorage.setItem('uni_session_v2',JSON.stringify({id:currentUser.id}));showApp()}function showApp(){document.getElementById('loginPage').classList.add('hidden');document.getElementById('appPage').classList.remove('hidden');document.getElementById('hname').innerText=currentUser.name;let f=faculties[currentUser.faculty];document.getElementById('hrole').innerText=(f?f.name:"")+" | "+currentUser.role;document.getElementById('hava').innerHTML=currentUser.photo?`<img src="${currentUser.photo}" style="width:100%;height:100%;object-fit:cover">`:currentUser.name[0];buildSidebar();openPage('dashboard')}function buildSidebar(){let s=document.getElementById('sidebar'),r=currentUser.role,h="";if(r=="student")h=`<div class="menu active" onclick="openPage('dashboard',this)">🏠 Кабинети шахсӣ</div><div class="menu" onclick="openPage('schedule',this)">📅 Ҷадвали дарс + Аудитория</div><div class="menu" onclick="openPage('grades',this)">⭐ Баҳо / Рейтинг</div><div class="menu" onclick="openPage('attendance',this)">✅ Ҳаст/Нест</div><div class="menu" onclick="openPage('exams',this)">📝 Имтиҳон</div><div class="menu" onclick="openPage('library',this)">📚 Китобхонаи электронӣ</div><div class="menu" onclick="openPage('payment',this)">💳 Пардохт</div><div class="menu" onclick="openPage('profile',this)">👤 Профил + Сурат</div>`;else if(r=="teacher")h=`<div class="menu active" onclick="openPage('dashboard',this)">🏠 Омӯзгор</div><div class="menu" onclick="openPage('t_students',this)">👨‍🎓 Донишҷӯён</div><div class="menu" onclick="openPage('t_attendance',this)">✅ Ҳаст/Нест гузор</div><div class="menu" onclick="openPage('t_grades',this)">⭐ Баҳо гузор</div><div class="menu" onclick="openPage('schedule',this)">📅 Ҷадвал</div><div class="menu" onclick="openPage('library',this)">📚 Китобхона</div>`;else if(r=="dean")h=`<div class="menu active" onclick="openPage('dashboard',this)">🏛️ Декан</div><div class="menu" onclick="openPage('t_students',this)">👨‍🎓 Факултет</div><div class="menu" onclick="openPage('library',this)">📚 Китобхона</div>`;else h=`<div class="menu active" onclick="openPage('dashboard',this)">👑 Админ</div><div class="menu" onclick="openPage('t_students',this)">👨‍🎓 Ҳама 6000</div><div class="menu" onclick="openPage('library',this)">📚 Китобхона</div>`;s.innerHTML=h}function openPage(page,el){if(el){document.querySelectorAll('.menu').forEach(m=>m.classList.remove('active'));el.classList.add('active')}let c=document.getElementById('content'),u=currentUser,f=faculties[u.faculty];if(page=='dashboard'){if(u.role=='student'){let att=DB.attendance[u.id]||{},pr=Object.values(att).filter(v=>v=='hast').length,tot=Object.keys(att).length||1,gr=DB.grades[u.id]||{},avg=Object.values(gr).length?(Object.values(gr).reduce((a,b)=>a+b,0)/Object.values(gr).length).toFixed(2):"0";c.innerHTML=`<div class="grid"><div class="card"><b>ID: ${u.id}</b><br>Факултет: ${f.name}<br>Декан: ${f.dekan}<br>Ауд: ${f.aud}<br>Гурӯҳ: ${u.group} Курс:${u.course}<br><span class="badge ${u.type=='sahar'?'b-sahar':'b-abet'}">${u.type=='sahar'?'Саҳархон':'Абетхон'}</span> <span class="badge ${u.payment=='roy'?'b-roy':'b-shart'}">${u.payment=='roy'?'Ройгон':'Шартномавӣ'}</span></div><div class="card"><h3>⭐ Рейтинг: ${avg}</h3></div><div class="card"><h3>✅ Давомот: ${pr}/${tot}</h3></div></div><div class="card"><h3>📢 Хабарҳо</h3>${DB.news.map(n=>`<div style="border-left:3px solid #1976d2;padding:8px;margin:6px 0;background:#f9f9f9"><b>${n.title}</b> <small>${n.date}</small><br>${n.text}</div>`).join('')}</div><div class="card"><h3>👨‍🏫 Омӯзгорон ва Фанҳо</h3><table><tr><th>Фан</th><th>Омӯзгор</th><th>Ауд</th></tr>${u.subjects.map(s=>{let t=Object.values(DB.users).find(x=>x.role=='teacher'&&x.subject==s&&x.faculty==u.faculty);return `<tr><td>${s}</td><td>${t?t.name:'—'}</td><td>${t?t.aud:f.aud}</td></tr>`}).join('')}</table></div>`}else if(u.role=='teacher'){c.innerHTML=`<div class="card"><h2>Салом, ${u.name}!</h2><p>Фан:${u.subject} Факултет:${f.name} Ауд:${u.aud}</p></div><div class="grid"><div class="card"><h3>Донишҷӯён: ${Object.values(DB.users).filter(x=>x.role=='student'&&x.faculty==u.faculty).length}</h3></div><div class="card"><button class="btn btn-p" onclick="openPage('t_attendance')">✅ Ҳаст/Нест</button></div><div class="card"><button class="btn btn-s" onclick="openPage('t_grades')">⭐ Баҳо</button></div></div>`}else if(u.role=='dean'){let studs=Object.values(DB.users).filter(x=>x.role=='student'&&x.faculty==u.faculty);c.innerHTML=`<div class="card"><h2>Деканати ${f.name}</h2><p>Декан:${u.name} Ауд:${f.aud}</p></div><div class="grid"><div class="card">Саҳар: ${studs.filter(s=>s.type=='sahar').length}</div><div class="card">Абет: ${studs.filter(s=>s.type=='abet').length}</div><div class="card">Ройгон: ${studs.filter(s=>s.payment=='roy').length}</div><div class="card">Шарт: ${studs.filter(s=>s.payment=='shart').length}</div></div>`}else{c.innerHTML=`<div class="card"><h2>Админ - 6000+200</h2></div><div class="grid"><div class="card">6000 донишҷӯ</div><div class="card">200 омӯзгор</div><div class="card">6 факултет</div><div class="card">${Object.values(DB.users).filter(x=>x.password).length} код</div></div>`}}else if(page=='schedule'){let days=["Душ","Се","Чор","Пан","Ҷум","Шан"],times=["08:00-09:30","09:40-11:10","11:20-12:50","13:30-15:00"],html=`<div class="card"><h3>📅 Ҷадвали дарс - ${f.name} ${f.aud} ${new Date().toLocaleDateString()}</h3><div style="overflow:auto"><table><tr><th>Вақт</th>${days.map(d=>`<th>${d}</th>`).join('')}</tr>`;times.forEach(t=>{html+=`<tr><td><b>${t}</b></td>`;days.forEach(()=>{let subj=u.subjects?u.subjects[Math.floor(Math.random()*u.subjects.length)]:subjectsList[f.faculty||u.faculty][0];html+=`<td>${subj}<br><small>${f.aud}</small></td>`});html+=`</tr>`});html+=`</table></div></div>`;c.innerHTML=html}else if(page=='grades'){let gr=DB.grades[u.id]||{};c.innerHTML=`<div class="card"><h3>⭐ Баҳоҳо</h3><table><tr><th>Фан</th><th>Баҳо</th><th>Омӯзгор</th></tr>${u.subjects.map(s=>`<tr><td>${s}</td><td><span class="badge" style="background:${(gr[s]||0)>=4?'#2e7d32':'#c62828'}">${gr[s]||'—'}</span></td><td>${(Object.values(DB.users).find(t=>t.subject==s)||{}).name||'—'}</td></tr>`).join('')}</table></div>`}else if(page=='attendance'){let att=DB.attendance[u.id]||{};c.innerHTML=`<div class="card"><h3>✅ Ҳаст/Нест Сентябр</h3><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px">${Array.from({length:30},(_,i)=>{let d=i+1,s=att[d],col=s=='hast'?'#2e7d32':s=='nest'?'#c62828':'#eee',txt=s=='hast'?'Ҳаст':s=='nest'?'Нест':d;return `<div style="background:${col};color:${s?'#fff':'#000'};padding:8px;border-radius:6px;text-align:center;font-size:12px">${txt}</div>`}).join('')}</div></div>`}else if(page=='exams'){c.innerHTML=`<div class="card"><h3>📝 Имтиҳонҳо</h3><table><tr><th>Фан</th><th>Сана</th><th>Ауд</th></tr>${u.subjects.map((s,i)=>`<tr><td>${s}</td><td>2026-10-${10+i}</td><td>${f.aud}</td></tr>`).join('')}</table></div>`}else if(page=='library'){c.innerHTML=`<div class="card"><h3>📚 Китобхона - 8 китоб</h3><input id="ls" placeholder="Ҷустуҷӯ..." oninput="filtLib()" style="max-width:300px"><div id="ll" class="grid" style="margin-top:10px">${DB.library.map(b=>`<div class="card" data-t="${(b.title+' '+b.author).toLowerCase()}" style="margin:0"><b>${b.title}</b><br><small>${b.author} | ${faculties[b.faculty]?.name}</small><br><button class="btn btn-p" style="margin-top:6px;padding:5px 10px;font-size:12px">📥 Зеркашӣ</button></div>`).join('')}</div></div>`}else if(page=='payment'){let paid=DB.payments[u.id]||u.paid;c.innerHTML=`<div class="card"><h3>💳 Пардохт: ${u.payment=='roy'?'Ройгон':'Шартномавӣ 4000 сом'}</h3><p>Вазъ: ${paid?'<span class="badge b-roy">Пардохт шуд ✅</span>':'<span class="badge b-shart">Нашудааст ❌</span>'}</p>${!paid&&u.payment=='shart'?`<button class="btn btn-s" onclick="payNow()">💳 Онлайн пардохт</button>`:''}</div>`}else if(page=='profile'){c.innerHTML=`<div class="card"><h3>👤 Профил ID:${u.id}</h3><p>Ном:${u.name}<br>Факултет:${f.name} Декан:${f.dekan} Ауд:${f.aud}<br>Код:${u.password}</p><label>Сурат:</label><input type="file" accept="image/*" onchange="upPhoto(event)"><div id="pp" style="margin-top:8px">${u.photo?`<img src="${u.photo}" style="width:100px;border-radius:10px">`:'Сурат нест'}</div><button class="btn" style="background:#c62828;color:#fff;margin-top:10px" onclick="changePw()">🔑 Код иваз</button></div>`}else if(page=='t_students'){let list=Object.values(DB.users).filter(x=>x.role=='student'&&(u.role=='admin'||x.faculty==u.faculty));c.innerHTML=`<div class="card"><h3>👨‍🎓 Донишҷӯён ${list.length} Саҳар:${list.filter(x=>x.type=='sahar').length} Абет:${list.filter(x=>x.type=='abet').length}</h3><input id="ss" placeholder="ID ё Ном" oninput="filtSt()" style="max-width:300px"><div style="max-height:60vh;overflow:auto"><table><thead><tr><th>ID</th><th>Ном</th><th>Факултет</th><th>Код</th></tr></thead><tbody id="stb">${list.slice(0,150).map(s=>`<tr><td>${s.id}</td><td>${s.name}</td><td>${s.faculty}</td><td>${s.password?'✅':'❌'}</td></tr>`).join('')}</tbody></table></div></div>`;window._all=list}else if(page=='t_attendance'){c.innerHTML=`<div class="card"><h3>✅ Ҳаст/Нест гузоштан ${new Date().toLocaleDateString()}</h3><select id="ag" onchange="loadAG()"><option>Гурӯҳ</option>${Array.from({length:20},(_,i)=>`<option>Г-${i+1}</option>`).join('')}</select><div id="al" style="margin-top:10px"></div></div>`}else if(page=='t_grades'){c.innerHTML=`<div class="card"><h3>⭐ Баҳо гузоштан</h3><input id="gid" placeholder="ID донишҷӯ" type="number"><select id="gsub">${(u.subjects||[u.subject]||Object.values(subjectsList).flat()).map(s=>`<option>${s}</option>`).join('')}</select><select id="gval"><option value="5">5 Аъло</option><option value="4">4 Хуб</option><option value="3">3</option><option value="2">2</option></select><button class="btn btn-s" onclick="setG()">Гузоштан</button><div id="gmsg" style="margin-top:8px"></div></div>`}}
function filtLib(){let q=document.getElementById('ls').value.toLowerCase();document.querySelectorAll('#ll.card').forEach(c=>c.style.display=c.dataset.t.includes(q)?'':'none')}function filtSt(){let q=document.getElementById('ss').value.toLowerCase(),fil=window._all.filter(s=>(s.id+'').includes(q)||s.name.toLowerCase().includes(q)).slice(0,150);document.getElementById('stb').innerHTML=fil.map(s=>`<tr><td>${s.id}</td><td>${s.name}</td><td>${s.faculty}</td><td>${s.password?'✅':'❌'}</td></tr>`).join('')}function payNow(){DB.payments[currentUser.id]=true;saveDB();alert('Пардохт шуд ✅');openPage('payment')}function upPhoto(e){let r=new FileReader();r.onload=ev=>{currentUser.photo=ev.target.result;saveDB();document.getElementById('pp').innerHTML=`<img src="${ev.target.result}" style="width:100px;border-radius:10px">`;document.getElementById('hava').innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover">`};r.readAsDataURL(e.target.files[0])}function changePw(){let np=prompt('Коди нав:');if(np&&np.length>=4){currentUser.password=np;saveDB();alert('Код:'+np)}}function loadAG(){let g=document.getElementById('ag').value,list=Object.values(DB.users).filter(x=>x.role=='student'&&x.faculty==currentUser.faculty&&x.group==g);if(!list.length)list=Object.values(DB.users).filter(x=>x.role=='student'&&x.faculty==currentUser.faculty).slice(0,30);let today=new Date().getDate();document.getElementById('al').innerHTML=`<table><tr><th>ID</th><th>Ном</th><th>Амал</th></tr>${list.map(s=>{let a=(DB.attendance[s.id]||{})[today];return `<tr><td>${s.id}</td><td>${s.name}</td><td><button class="btn" style="background:${a=='hast'?'#2e7d32':'#eee'};padding:4px 8px" onclick="markA(${s.id},'hast')">Ҳаст</button> <button class="btn" style="background:${a=='nest'?'#c62828':'#eee'};padding:4px 8px" onclick="markA(${s.id},'nest')">Нест</button> ${a||''}</td></tr>`}).join('')}</table>`}function markA(id,st){if(!DB.attendance[id])DB.attendance[id]={};DB.attendance[id][new Date().getDate()]=st;saveDB();loadAG()}function setG(){let sid=parseInt(document.getElementById('gid').value),subj=document.getElementById('gsub').value,val=parseInt(document.getElementById('gval').value);if(!DB.users[sid]||DB.users[sid].role!='student'){document.getElementById('gmsg').innerHTML="<span style='color:red'>ID нодуруст</span>";return}if(!DB.grades[sid])DB.grades[sid]={};DB.grades[sid][subj]=val;saveDB();document.getElementById('gmsg').innerHTML=`<span style='color:green'>Ба ${sid} ${subj} ${val} ✅</span>`}function doLogout(){localStorage.removeItem('uni_session_v2');location.reload()}let sess=JSON.parse(localStorage.getItem('uni_session_v2')||'null');if(sess&&DB.users[sess.id]){currentUser=DB.users[sess.id];showApp()}
</script></body></html>
