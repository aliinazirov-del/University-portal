<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal V2</title><style>body{font-family:sans-serif;background:#eef;padding:20px;text-align:center}.box{background:#fff;padding:20px;border-radius:15px;max-width:400px;margin:auto} input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px} button{width:100%;padding:12px;background:#0d47a1;color:#fff;border:none;border-radius:8px;font-weight:bold}</style></head><body><div class="box"><h2>🎓 Портали Донишгоҳ V2</h2><p>6000 донишҷӯ | 200 омӯзгор</p><input id="id" placeholder="ID: 1-6000 донишҷӯ, 7001 омӯзгор, 9999 админ"><input id="pw" type="password" placeholder="Коди шахсӣ - бори аввал худатон гузоред"><button onclick="go()">Ворид шудан</button><p id="m" style="font-size:12px;margin-top:10px"></p><p style="font-size:11px;color:gray">Мисол: ID 1 + код 1234 гузоред. Баъд ҳар кас бо коди худ медарояд, ба кабинети дигаре даромада наметавонад!</p></div><script>let DB=JSON.parse(localStorage.getItem('db')||'null');if(!DB){DB={u:{}};for(let i=1;i<=6000;i++)DB.u[i]={id:i,n:'Донишҷӯ '+i,role:'student',pw:null};for(let i=7001;i<=7200;i++)DB.u[i]={id:i,n:'Омӯзгор '+(i-7000),role:'teacher',pw:null};DB.u[9999]={id:9999,n:'Админ',role:'admin',pw:'9999'};localStorage.setItem('db',JSON.stringify(DB))}function go(){let id=document.getElementById('id').value,p=document.getElementById('pw').value,u=DB.u[id];if(!u){document.getElementById('m').innerHTML='ID нест';return}if(!u.pw){if(p.length>=4){u.pw=p;localStorage.setItem('db',JSON.stringify(DB));document.getElementById('m').innerHTML='Код гузошта шуд:'+p+' Боз пахш кунед!'}else document.getElementById('m').innerHTML='Код гузоред 4 рақам';return}if(u.pw!=p){document.getElementById('m').innerHTML='Код нодуруст!';return}alert('Хуш омадед '+u.n+'! Кабинети шахсии шумо. V2 пурра дар роҳ аст!');}</script></body></html>
